spring.application.name=expense-service-project
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expenses}
spring.datasource.username=${DB_USERNAME:expenseuser}
spring.datasource.password=${DB_PASSWORD:expensepass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
