
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statistics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statistics-service
  template:
    metadata:
      labels:
        app: statistics-service
    spec:
      containers:
        - name: statistics-service
          image: kaalepou/statistics-service:1.0
          ports:
            - containerPort: 8082
          env:
            - name: EXPENSE_SERVICE_URL
              value: http://expense-service:8081
---
apiVersion: v1
kind: Service
metadata:
  name: statistics-service
spec:
  type: NodePort
  selector:
    app: statistics-service
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
